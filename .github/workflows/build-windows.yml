name: Build MX Analog Delay 2 VST3 Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: mxdelay-windows-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate material library and layout
        shell: pwsh
        run: |
          python -m pip install -r scripts/gui3d-requirements.txt
          python tests/test_gui3d_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_gui_c_layout.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DSMTG_CREATE_PLUGIN_LINK=0
      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --target JerzyMXAnalogDelay2 MXDelayDSPTests MXDelayCompatibilityTests MXReverbTests MXReverbHostTests MXDelayGUITests --parallel
      - name: Test DSP and GUI
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --verbose --output-on-failure -R "^(MXDelayDSP|MXDelayCompatibility|MXReverb|MXReverbHost|MXDelayGUI)$"
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            # Expose test diagnostics in check annotations as well as runner logs.
            $message = (Get-Content build/Testing/Temporary/LastTest.log -Raw).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=CTest::$message"
            exit $testExit
          }
      - name: Validate rendered control states
        shell: pwsh
        run: python scripts/verify_gui_renders.py build
      - name: Independent pluginval validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
          Invoke-WebRequest 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip' -OutFile pluginval.zip
          if ((Get-FileHash pluginval.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab') { throw 'pluginval checksum mismatch' }
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $plugin = Get-ChildItem build -Recurse -Directory -Filter 'MX Delay 2.vst3' | Select-Object -First 1
          & ./pluginval/pluginval.exe --strictness-level 5 --random-seed 1971 --sample-rates 44100,48000,96000 --block-sizes 64,128,257,1024 --output-dir build/pluginval-logs --validate $plugin.FullName *> build/pluginval-console.txt
          $valExit = $LASTEXITCODE
          if ($valExit -ne 0) {
            $message = (Get-Content build/pluginval-console.txt -Raw).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=pluginval::$message"
            throw "pluginval failed: $valExit"
          }
          } catch {
            $message = ($_ | Out-String).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=pluginval setup or execution::$message"
            throw
          }
      - name: Package
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "MX Delay 2.vst3" | Select-Object -First 1
          if (-not $plugin) { throw "JerzyMXAnalogDelay2.vst3 was not produced" }
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item -Recurse -Force $plugin.FullName "artifact/MX Delay 2.vst3"
          # Ship the complete VST3 bundle. The UI's UIDescription must be present.
          $bundle = "artifact/MX Delay 2.vst3"
          $resource = Join-Path $bundle "Contents/Resources/mxdelay.uidesc"
          if (-not (Test-Path $resource)) { throw "VST3 GUI unavailable: missing mxdelay.uidesc" }
          $module = Get-ChildItem $bundle -Recurse -File -Filter "MX Delay 2.vst3" | Select-Object -First 1
          if (-not $module) { throw "VST3 processor binary missing" }
          python scripts/verify_bundle.py $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Incomplete GUI resources' }
          Copy-Item build/reverb-results artifact/reverb-results -Recurse
          Copy-Item docs/REVERB_VALIDATION.md artifact/
          Copy-Item docs/INSTALL_FL_STUDIO.md artifact/
          Copy-Item docs/GUI3D_ASSET_AUDIT.md artifact/
          Copy-Item docs/GUI3D_VALIDATION.md artifact/
          Copy-Item build/Testing/Temporary/LastTest.log artifact/CTEST_RESULTS.txt
          Copy-Item build/pluginval-logs artifact/pluginval-logs -Recurse
          git rev-parse HEAD | Set-Content artifact/COMMIT.txt
          git archive --format=zip --output=artifact/MX_Delay_2-source.zip HEAD
          Copy-Item source/engines/AGPL-3.0-LICENSE.txt artifact/
          Copy-Item build/_deps/vst3sdk-src/LICENSE.txt artifact/VST3-SDK-LICENSE.txt
          Copy-Item build/_deps/vst3sdk-src/vstgui4/LICENSE artifact/VSTGUI-LICENSE.txt
          Compress-Archive -Path artifact/* -DestinationPath MX_Delay_2_Windows_x64.zip -Force
          Get-FileHash MX_Delay_2_Windows_x64.zip -Algorithm SHA256 | Format-List | Out-File MX_Delay_2_SHA256.txt
          Compress-Archive -Path resource/gui3d,scripts/render_gui3d_assets.py,scripts/gui3d-requirements.txt -DestinationPath MX_Delay_2_GUI3D_Library.zip -Force
      - name: Collect GUI renders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force gui-renders | Out-Null
          Get-ChildItem -Path build -Recurse -Filter "mxdelay2-render-*.png" | ForEach-Object {
            Copy-Item -Force $_.FullName (Join-Path "gui-renders" $_.Name)
          }
      - name: Upload GUI renders
        uses: actions/upload-artifact@v4
        with:
          name: JerzyMXAnalogDelay2-GUI-Renders
          path: gui-renders/*.png
          if-no-files-found: error
          retention-days: 90
      - name: Upload MX Analog Delay
        uses: actions/upload-artifact@v4
        with:
          name: JerzyMXAnalogDelay2-Windows-x64
          path: |
            MX_Delay_2_Windows_x64.zip
            MX_Delay_2_SHA256.txt
            MX_Delay_2_GUI3D_Library.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MX-Delay-2-diagnostics
          path: |
            build/reverb-results
            build/Testing/Temporary/*.log
            build/pluginval-logs
            build/pluginval-console.txt
            build/mxdelay2-render-*.png
          if-no-files-found: warn
